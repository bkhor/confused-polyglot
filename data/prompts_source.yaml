- item_id: NAR-01
  condition: narrative_task
  roles: [core_grid]
  text: >-
    The lighthouse at Carrick Point ran unattended for the first time in ninety years. The last
    keeper, a man named Brennan, had climbed the spiral stair twice a night since he was
    twenty-three, trimming the wick in the early years and later only checking that the
    automatic lamp had turned. On his final evening he carried up a chair, sat beside the
    lantern, and watched the beam sweep the water until dawn. The following week a technician
    arrived from the mainland, installed a remote monitor, and locked the door behind him. The
    light has not failed since. Summarise this passage in one sentence.
  instruction_sentence: "Summarise this passage in one sentence."
  contains_proper_noun: true
  explicitly_told_degraded: false
  expected_answer: null
