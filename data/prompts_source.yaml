    and filling them instead with food stalls, a temporary stage, and strings of paper lanterns overhead.
    This year a sudden power cut hit the main stage right as the headline band started their set, and
    for a tense minute the crowd stood in the dark before someone found the backup generator in a locked
    shed nobody had checked. The band restarted the same song from the beginning, and the crowd cheered
    louder for the second attempt than they had for the first. Summarise this passage in one sentence.
