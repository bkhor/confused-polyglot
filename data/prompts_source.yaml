  language_origin: en

- item_id: NAR-02
  condition: narrative_task
  roles: [core_grid]
  text: >-
    Every autumn the market square filled with crates of apples brought down from the orchards
    on the ridge. Growers argued over prices while children ran between the stalls collecting
    the fruit that rolled loose. By the third day the square smelled of cider and wet straw, and
    the stone cobbles were slick with it. The festival ended when the last crate was sold,
    usually around dusk, and by the next morning the square was swept clean and empty again, as
    though none of it had happened. Summarise this passage in one sentence.
