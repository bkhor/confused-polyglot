- item_id: META-01
  condition: meta
  roles: [core_grid]
  text: >-
    I have written a simple text in which every word is translated into a randomly chosen
    language, drawn from a pool of about thirty. I then submitted the results to several of
    the main models, including frontier ones, and asked them to decode it. Since each word is
    translated separately, I would guess that a great deal of context is lost. Even so, can the
    models still recognise what the original text was about? Tell me what you think the
    original text said.
